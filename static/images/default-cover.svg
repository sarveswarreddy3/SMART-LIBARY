<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>
  <!-- Book Cover Background -->
  <rect x="0" y="0" width="200" height="280" rx="8" fill="url(#bookGrad)" />
  <!-- Spine Shadow -->
  <rect x="0" y="0" width="16" height="280" rx="4" fill="url(#spineGrad)" opacity="0.6" />
  <!-- Embossed Accent Border -->
  <rect x="26" y="20" width="154" height="240" rx="6" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 2" />
  <!-- Teal Emblem Banner -->
  <circle cx="103" cy="95" r="34" fill="url(#tealGrad)" opacity="0.9" />
  <!-- Book Icon in Center -->
  <path d="M92 84 C92 84, 98 86, 103 89 C108 86, 114 84, 114 84 V108 C114 108, 108 110, 103 113 C98 110, 92 108, 92 108 Z" fill="#ffffff" />
  <path d="M103 89 V113" stroke="#0f172a" stroke-width="1.5" />
  <!-- Simulated Title Lines -->
  <rect x="50" y="150" width="106" height="8" rx="4" fill="#f8fafc" opacity="0.9" />
  <rect x="65" y="166" width="76" height="6" rx="3" fill="#94a3b8" opacity="0.7" />
  <rect x="75" y="180" width="56" height="4" rx="2" fill="#0d9488" />
  <!-- Library Edition stamp -->
  <text x="103" y="235" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#64748b" text-anchor="middle" letter-spacing="1">ACADEMIC EDITION</text>
</svg>
