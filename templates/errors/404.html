{% extends "base.html" %}

{% block title %}404 Not Found - Page Missing{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="stat-icon amber mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem;">
            <i class="bi bi-file-earmark-x"></i>
        </div>
        <h1 class="fw-bold text-navy display-4">404</h1>
        <h4 class="fw-bold text-navy mb-2">Record or Page Not Found</h4>
        <p class="text-secondary mb-4">
            The requested library URL, book record, or transaction ID could not be located in our catalog database.
        </p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-navy px-4">
            <i class="bi bi-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
