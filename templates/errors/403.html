{% extends "base.html" %}

{% block title %}403 Forbidden - Access Denied{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="stat-icon rose mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem;">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1 class="fw-bold text-navy display-4">403</h1>
        <h4 class="fw-bold text-navy mb-2">Access Restricted</h4>
        <p class="text-secondary mb-4">
            You do not possess the required administrator permissions to view or modify this resource.
        </p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-navy px-4">
            <i class="bi bi-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
