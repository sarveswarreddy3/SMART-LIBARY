{% extends "base.html" %}

{% block title %}{{ title }} - {{ library_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-7">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <a href="{{ url_for('members.index') }}" class="btn btn-sm btn-outline-secondary mb-2">
                    <i class="bi bi-arrow-left me-1"></i> Back to Members
                </a>
                <h3 class="fw-bold text-navy mb-0">{{ title }}</h3>
            </div>
        </div>

        <div class="card card-custom">
            <div class="card-body p-4 p-md-5">
                <form method="POST" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row g-3 mb-4">
                        <!-- Member ID -->
                        <div class="col-md-6">
                            <label for="member_id" class="form-label small fw-semibold text-secondary">Library Member ID <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="member_id" name="member_id" value="{{ member.member_id if member else suggested_id }}" {% if member %}readonly class="form-control bg-light"{% endif %} required>
                            <div class="form-text small">Unique institutional library membership code.</div>
                        </div>

                        <!-- Student / Staff ID -->
                        <div class="col-md-6">
                            <label for="student_staff_id" class="form-label small fw-semibold text-secondary">College / Roll ID <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="student_staff_id" name="student_staff_id" value="{{ member.student_staff_id if member else '' }}" placeholder="e.g. 21CSE1042 or FAC-309" required>
                            <div class="form-text small">Official university registration identifier.</div>
                        </div>

                        <!-- Full Name -->
                        <div class="col-12">
                            <label for="full_name" class="form-label small fw-semibold text-secondary">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="full_name" name="full_name" value="{{ member.full_name if member else '' }}" placeholder="e.g. Aarav Sharma" required>
                        </div>

                        <!-- Email -->
                        <div class="col-md-6">
                            <label for="email" class="form-label small fw-semibold text-secondary">Institutional Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ member.email if member else '' }}" placeholder="e.g. aarav.cse@apex.edu" required>
                        </div>

                        <!-- Phone -->
                        <div class="col-md-6">
                            <label for="phone" class="form-label small fw-semibold text-secondary">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" value="{{ member.phone if member else '' }}" placeholder="e.g. +91 9876543210">
                        </div>

                        <!-- Department -->
                        <div class="col-md-6">
                            <label for="department" class="form-label small fw-semibold text-secondary">Academic Department <span class="text-danger">*</span></label>
                            <select class="form-select" id="department" name="department" required>
                                <option value="" disabled {% if not member %}selected{% endif %}>Select department...</option>
                                {% for dept in departments %}
                                <option value="{{ dept }}" {% if member and member.department == dept %}selected{% endif %}>{{ dept }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Membership Status -->
                        <div class="col-md-6">
                            <label for="status" class="form-label small fw-semibold text-secondary">Membership Status <span class="text-danger">*</span></label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="Active" {% if not member or member.status == 'Active' %}selected{% endif %}>Active (Eligible to borrow)</option>
                                <option value="Suspended" {% if member and member.status == 'Suspended' %}selected{% endif %}>Suspended (Borrowing on hold)</option>
                                <option value="Expired" {% if member and member.status == 'Expired' %}selected{% endif %}>Expired</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a href="{{ url_for('members.index') }}" class="btn btn-light border px-4">Cancel</a>
                        <button type="submit" class="btn btn-navy px-4 fw-semibold">
                            <i class="bi bi-save me-1"></i> Save Member Profile
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
